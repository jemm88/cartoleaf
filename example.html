
            <!DOCTYPE html>
            <html>
            <head>
            <meta charset="utf-8">
            <title>Cartoleaf Map</title>
            
<link
  rel="stylesheet"
  href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
            </head>
            <body>
            
<div id="cartoleaf-map" style="height: 500px;"></div>

            
<script>
(function () {
  const map = L.map("cartoleaf-map").setView([1.3521, 103.8198], 12);

  L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
    maxZoom: 19,
    attribution: "&copy; <a href=\"https://www.openstreetmap.org/\">OpenStreetMap</a> contributors"
  }).addTo(map);

  
  const marker1 = L.marker([1.3, 103.8]).addTo(map);

  
  marker1.bindPopup("Property A");
  

  
  marker1.on("click", function () {
    document.dispatchEvent(new CustomEvent("marker:clicked", {
      detail: {"id": 1, "name": "Property A", "price": 1500000}
    }));
  });
  
  marker1.on("mouseover", function () {
    document.dispatchEvent(new CustomEvent("marker:hovered", {
      detail: {"id": 1, "name": "Property A", "price": 1500000}
    }));
  });
  
  
})();
</script>

            <script>
                document.addEventListener("marker:clicked", function (event) {
                console.log("Marker clicked:", event.detail);
                });
            </script>
            </body>
            </html>
