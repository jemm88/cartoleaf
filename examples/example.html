<script>
(function () {
  const eventAliases = {
    click: "click",
    hoverin: "mouseover",
    hoverout: "mouseout"
  };

  // Utility function to emit custom events with consistent payload structure
  function emitCartoleafEvent(eventName, objectId, eventType, data) {
    document.dispatchEvent(new CustomEvent(eventName, {
      detail: {
        object_id: objectId,
        event_type: eventType,
        data: data
      }
    }));
  }

  // Marker events
  
  
  const markerObj1 = window.cartoleaf.markers["marker-9b28a7563e6645258d95fdf4e61ba087"];

  
  if (eventAliases["click"]) {
    markerObj1.on(
      eventAliases["click"],
      function (e) {
        

        

        emitCartoleafEvent(
          "marker:clicked",
          "marker-9b28a7563e6645258d95fdf4e61ba087",
          "click",
          {
            type: "marker",
            id: "marker-9b28a7563e6645258d95fdf4e61ba087",
            lat: 1.3,
            lng: 103.8,
            data: {"id": 1, "name": "Property A", "price": 1500000}
          }
        );
      }
    );
  }
  
  if (eventAliases["hoverin"]) {
    markerObj1.on(
      eventAliases["hoverin"],
      function (e) {
        
        this.openPopup();
        

        

        emitCartoleafEvent(
          "marker:hovered",
          "marker-9b28a7563e6645258d95fdf4e61ba087",
          "hoverin",
          {
            type: "marker",
            id: "marker-9b28a7563e6645258d95fdf4e61ba087",
            lat: 1.3,
            lng: 103.8,
            data: {"id": 1, "name": "Property A", "price": 1500000}
          }
        );
      }
    );
  }

})();
</script>
